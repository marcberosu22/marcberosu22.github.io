<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Planner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f7fb;
    }

    header {
      background: #3b82f6;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .subject {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      color: white;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .exam {
      border-left: 6px solid #ccc;
      padding-left: 15px;
      margin-bottom: 15px;
    }

    .high { border-color: #ef4444; }
    .medium { border-color: #f59e0b; }
    .low { border-color: #10b981; }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .date {
      font-size: 14px;
      color: #555;
    }

    .hours {
      font-size: 14px;
      margin-top: 5px;
    }

    .done {
      color: green;
      font-weight: bold;
    }

    .pending {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

<header>
  <h1>📚 Study Planner</h1>
</header>

<div class="container">

  <!-- SUBJECT -->
  <div class="card">
    <div class="subject" style="background:#3b82f6;">
      Matemàtiques
    </div>
  </div>

  <!-- EXAMS -->
  <div class="card">
    <h2>Exámenes</h2>

    <div class="exam high">
      <div class="title">Tema 0</div>
      <div class="date">Fecha: 24 Marzo 2026</div>
      <div class="hours">Horas de estudio: 5</div>
      <div class="pending">Pendiente</div>
    </div>

    <div class="exam medium">
      <div class="title">Tema 1</div>
      <div class="date">Fecha: 22 Abril 2026</div>
      <div class="hours">Horas de estudio: 5</div>
      <div class="pending">Pendiente</div>
    </div>

  </div>

</div>

</body>
</html>
